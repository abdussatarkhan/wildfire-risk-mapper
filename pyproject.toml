[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire_risk_mapper"
version = "1.0.0"
description = "Wildfire Spread Risk Mapper: Geospatial analysis, spatial autocorrelation, machine learning risk modeling, and interactive web mapping for wildfire hazard mitigation."
readme = "README.md"
authors = [
    { name = "Abdussatar", email = "satarabdus692@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis"
]
